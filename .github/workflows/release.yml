name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            gradle wrapper
            chmod +x ./gradlew
          fi

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Locate and Rename APK
        id: prepare-release
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "refs/heads/main" ]; then
            TAG_NAME="v0.1.0"
          fi
          
          ORIGINAL_APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$ORIGINAL_APK" ] || [ ! -f "$ORIGINAL_APK" ]; then
            echo "::error::No APK artifact found after build"
            exit 1
          fi
          
          OUTPUT_APK="Daynexa-${TAG_NAME}.apk"
          cp "$ORIGINAL_APK" "$OUTPUT_APK"
          echo "Ready release APK: $OUTPUT_APK"
          echo "apk_name=$OUTPUT_APK" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Daynexa ${{ steps.prepare-release.outputs.tag_name }}
          tag_name: ${{ steps.prepare-release.outputs.tag_name }}
          files: ${{ steps.prepare-release.outputs.apk_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
