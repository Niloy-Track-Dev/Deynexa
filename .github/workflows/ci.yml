name: Android APK CI/CD

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p android/keystore
          KEYSTORE_FILE="$GITHUB_WORKSPACE/android/keystore/daynexa-keystore.jks"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using base64 keystore from GitHub secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            STORE_PASS="${STORE_PASSWORD_SECRET:-daynexa123}"
            KEY_PASS="${KEY_PASSWORD_SECRET:-daynexa123}"
            ALIAS="${KEY_ALIAS_SECRET:-daynexa-key}"
          else
            echo "Generating fallback signing keystore..."
            keytool -genkeypair -v -keystore "$KEYSTORE_FILE" \
              -alias daynexa-key -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass daynexa123 -keypass daynexa123 \
              -dname "CN=Daynexa, OU=App, O=Niloy, L=Dhaka, S=Dhaka, C=BD"
            STORE_PASS="daynexa123"
            KEY_PASS="daynexa123"
            ALIAS="daynexa-key"
          fi

          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
          echo "STORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          echo "KEY_ALIAS=$ALIAS" >> $GITHUB_ENV

      - name: Grant Gradle Executable
        run: chmod +x android/gradlew

      - name: Build APKs with Gradle
        working-directory: ./android
        run: |
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Locate and Save APK
        run: |
          echo "Searching for built APKs..."
          find android/app/build/outputs/apk -name "*.apk"
          
          RELEASE_APK=$(find android/app/build/outputs/apk -name "*release*.apk" | head -n 1)
          DEBUG_APK=$(find android/app/build/outputs/apk -name "*debug*.apk" | head -n 1)
          
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" Daynexa-release.apk
            echo "Copied Release APK successfully."
          fi
          
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" Daynexa-app.apk
            echo "Copied Debug/App APK successfully."
          fi
          
          if [ ! -f "Daynexa-app.apk" ] && [ -f "Daynexa-release.apk" ]; then
            cp Daynexa-release.apk Daynexa-app.apk
          fi
          
          if [ ! -f "Daynexa-app.apk" ]; then
            echo "::error::No APK found after build!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daynexa-APK
          path: |
            Daynexa-app.apk
            Daynexa-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v3.0.0-nightly' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Daynexa Latest APK Build' }}
          files: |
            Daynexa-app.apk
            Daynexa-release.apk
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: true
          fail_on_unmatched_files: false
          body: |
            ## 📱 Daynexa Mobile App (Android APK)

            ### 🚀 Direct Download:
            - **[Daynexa-app.apk](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v3.0.0-nightly' }}/Daynexa-app.apk)** (Ready-to-install Android APK)
            - **[Daynexa-release.apk](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v3.0.0-nightly' }}/Daynexa-release.apk)** (Release Signed APK)

            > ⚠️ **Note:** Download **`Daynexa-app.apk`** or **`Daynexa-release.apk`** to install on your phone.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
