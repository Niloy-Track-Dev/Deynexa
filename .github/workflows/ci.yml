name: Web CI/CD

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Daynexa Web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Web App
        run: npm run build

      - name: Package Distribution Archive
        run: |
          tar -czf daynexa-web-dist.tar.gz -C dist .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daynexa-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "v3.0.0"
          tag_name: "v3.0.0"
          files: daynexa-web-dist.tar.gz
          draft: false
          prerelease: false
          body: |
            ### Daynexa v3.0.0 — Web Edition Release

            Welcome to **Daynexa v3.0.0**, the privacy-first, 100% offline daily routine, habit management, and productivity intelligence web application built with React 19, TypeScript, Vite, and Tailwind CSS.

            #### What's Included:
            - **Smart Daily Planner (`Today`)**: Deterministic recurrence engine, occurrence rescheduling, accountability skip reasons, and progress gauge.
            - **Interactive Calendar Matrix**: Month-at-a-glance with 4-level color intensity completion indicators.
            - **Productivity Score 2.0**: 0–100 score, 7-day completion chart, 14-week (98-day) consistency heatmap, and weekly review debriefs.
            - **App Usage & Productivity Diagnostics**: Screen time breakdown, app quality ratings, risk severity, and custom tagging.
            - **Focentra Study Focus Integration**: Built-in focus session timer with automated session logging.
            - **Unified JSON Portability**: Full backup export & import with Merge vs Replace mode.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
