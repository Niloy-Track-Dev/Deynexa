name: Android CI/CD

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Package APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      - name: Clear Gradle Cache
        run: ./gradlew clean --no-daemon

      - name: Prepare Signing Keystore
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Configure KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD, and KEY_ALIAS GitHub Actions secrets before publishing a release."
            exit 1
          fi
          KEYSTORE_PATH="$GITHUB_WORKSPACE/daynexa-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Run Unit Tests
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Release APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Build Debug APK
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Extract App Version
        id: extract-version
        run: |
          VER_NAME=$(grep "versionName =" app/build.gradle.kts | head -n 1 | awk -F '"' '{print $2}')
          if [ -z "$VER_NAME" ]; then
            echo "::error::Could not extract versionName from app/build.gradle.kts"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VER_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version v$VER_NAME"
            exit 1
          fi
          echo "APP_VERSION=$VER_NAME" >> $GITHUB_ENV
          echo "Extracted App Version: $VER_NAME"

      - name: Locate & Prepare Release Artifact
        id: prepare-apk
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            BUILD_TYPE="release"
            APK_PATH=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          else
            BUILD_TYPE="debug"
            APK_PATH=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::No APK found in build outputs"
            exit 1
          fi
          FINAL_NAME="Daynexa-v${{ env.APP_VERSION }}-${BUILD_TYPE}.apk"
          echo "Found APK at: $APK_PATH -> Copying to $FINAL_NAME"
          cp "$APK_PATH" "$FINAL_NAME"
          echo "apk_path=$FINAL_NAME" >> "$GITHUB_OUTPUT"
          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daynexa-${{ steps.prepare-apk.outputs.build_type }}-APK-v${{ env.APP_VERSION }}
          path: ${{ steps.prepare-apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ env.APP_VERSION }}"
          tag_name: "v${{ env.APP_VERSION }}"
          files: Daynexa-v${{ env.APP_VERSION }}-release.apk
          draft: false
          prerelease: false
          body: |
            ### Daynexa v${{ env.APP_VERSION }}

            Welcome to release **v${{ env.APP_VERSION }}** of **Daynexa** — Build Better Days!

            #### Highlights
            - Refined task cards with tighter spacing and category badges aligned alongside schedule times.
            - Updated Android version to **1.3.9** (version code **23**).

            #### Installation Instructions
            1. Download **`Daynexa-v${{ env.APP_VERSION }}-release.apk`** below.
            2. Open the APK on your Android device (Android 8.0+ / API 26+) and confirm installation.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
