name: Android CI/CD

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Package APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: Prepare Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/my-upload-key.jks"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "Generating automated fallback release keystore..."
            keytool -genkey -v -keystore "$GITHUB_WORKSPACE/my-upload-key.jks" \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Daynexa, OU=Daynexa, O=Niloy, L=Daynexa, S=Daynexa, C=US"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Run Unit Tests
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Locate & Prepare Release Artifact
        id: prepare-apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::No APK found in build outputs"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" Daynexa-v0.1.0-release.apk
          echo "apk_path=Daynexa-v0.1.0-release.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daynexa-Release-APK
          path: Daynexa-v0.1.0-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Daynexa v0.1.0 (MVP Release)"
          tag_name: "v0.1.0"
          files: Daynexa-v0.1.0-release.apk
          draft: false
          prerelease: false
          body: |
            ### 🚀 Daynexa v0.1.0 Release
            
            Welcome to the initial release of **Daynexa** — the privacy-first, 100% offline daily routine and habit management Android application.
            
            #### ✨ Highlights
            - 📅 Deterministic daily routine and recurring habit scheduling
            - 📊 14-week consistency heatmap & streak performance analytics
            - 🗓️ Interactive monthly calendar matrix with completion indicators
            - 🏷️ Custom categories with custom color palettes and icons
            - 🔒 100% Offline-First (Room SQLite) & Zero Telemetry
            - 💾 JSON Database Backup & Restore
            
            #### 📦 Download
            - Download `Daynexa-v0.1.0-release.apk` below and install directly on Android 8.0+ (API 26+).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
