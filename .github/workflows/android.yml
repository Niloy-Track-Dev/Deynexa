name: Android CI/CD

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Package APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      - name: Clear Gradle Cache
        run: ./gradlew clean --no-daemon

      - name: Prepare Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/my-upload-key.jks"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          else
            echo "Generating automated fallback release keystore..."
            keytool -genkey -v -keystore "$GITHUB_WORKSPACE/my-upload-key.jks" \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Daynexa, OU=Daynexa, O=Niloy, L=Daynexa, S=Daynexa, C=US"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=upload" >> $GITHUB_ENV
          fi

      - name: Run Unit Tests
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Locate & Prepare Release Artifact
        id: prepare-apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::No APK found in build outputs"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" Daynexa-v2.0.0-release.apk
          echo "apk_path=Daynexa-v2.0.0-release.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daynexa-Release-APK
          path: Daynexa-v2.0.0-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "v2.0.0"
          tag_name: "v2.0.0"
          files: Daynexa-v2.0.0-release.apk
          draft: false
          prerelease: false
          body: |
            ### Daynexa v2.0.0 Major Release

            Welcome to release v2.0.0 of **Daynexa** — the privacy-first, 100% offline daily routine and habit management Android application built with Jetpack Compose.

            #### Major Highlights & What's New in v2.0.0
            - **Settings Screen Layout & Design Fixes**: Improved layout and responsive text handling (e.g. fixed "Focentra Study Focus" card wrapping).
            - **Task Double-Tap Gesture & Shadow Removal**: Optimized task uncomplete threshold to 2 taps and removed unwanted card click shadows/ripples.
            - **Stats Screen & Productivity Score Overhaul**: Fixed period switching (Today / Weekly / Monthly) date ranges with user week start day preference and enhanced productivity score calculations.
            - **Category Enhancements**: Added horizontal color selector with expanded palette (15 colors) and 12 new Material icons.
            - **Category Double-Tap Deletion**: Double-tap any category in App Classification to quickly trigger deletion.
            - **Custom Time Picker for Reminders**: Added 12H/24H Material3 TimePicker dialog for custom default reminder timing.
            - **Targeted App Diagnostic System**: Select specific apps for detailed foreground & usage diagnostic tracking. Integrated targeted app usage cards into Statistics view.
            - **Chunked Data Import & Export Engine**: High-performance batch Room database operations handling large data exports/imports seamlessly with real-time status feedback.

            #### Installation Instructions
            1. Download **`Daynexa-v2.0.0-release.apk`** below.
            2. Open the APK on your Android device (Android 8.0+ / API 26+) and confirm installation.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
