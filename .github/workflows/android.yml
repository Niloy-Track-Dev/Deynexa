name: Android CI/CD

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Package APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      - name: Clear Gradle Cache
        run: ./gradlew clean --no-daemon

      - name: Prepare Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/my-upload-key.jks"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          else
            echo "Generating automated fallback release keystore..."
            keytool -genkey -v -keystore "$GITHUB_WORKSPACE/daynexa-keystore.jks" \
              -alias daynexa-key -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass daynexa123 -keypass daynexa123 \
              -dname "CN=Daynexa, OU=App, O=Niloy, L=Dhaka, S=Dhaka, C=BD"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/daynexa-keystore.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=daynexa123" >> $GITHUB_ENV
            echo "KEY_PASSWORD=daynexa123" >> $GITHUB_ENV
            echo "KEY_ALIAS=daynexa-key" >> $GITHUB_ENV
          fi

      - name: Run Unit Tests
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Extract App Version
        id: extract-version
        run: |
          VER_NAME=$(grep "versionName =" app/build.gradle.kts | head -n 1 | awk -F '"' '{print $2}')
          if [ -z "$VER_NAME" ]; then
            VER_NAME="1.1.0"
          fi
          echo "APP_VERSION=$VER_NAME" >> $GITHUB_ENV
          echo "Extracted App Version: $VER_NAME"

      - name: Locate & Prepare Release Artifact
        id: prepare-apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::No APK found in build outputs"
            exit 1
          fi
          FINAL_NAME="Daynexa-v${{ env.APP_VERSION }}-release.apk"
          echo "Found APK at: $APK_PATH -> Copying to $FINAL_NAME"
          cp "$APK_PATH" "$FINAL_NAME"
          echo "apk_path=$FINAL_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daynexa-Release-APK-v${{ env.APP_VERSION }}
          path: Daynexa-v${{ env.APP_VERSION }}-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ env.APP_VERSION }}"
          tag_name: "v${{ env.APP_VERSION }}"
          files: Daynexa-v${{ env.APP_VERSION }}-release.apk
          draft: false
          prerelease: false
          body: |
            ### Daynexa v${{ env.APP_VERSION }} Major Release

            Welcome to release **v${{ env.APP_VERSION }}** of **Daynexa** — Build Better Days!

            #### Release Highlights in v${{ env.APP_VERSION }}
            - **Signed APK Release**: Built and signed with the official Daynexa keystore for easy updates.
            - **Target App In-Details Diagnostics**: Select specific installed target apps for deep screen time, usage, and focus tracking.
            - **High Performance Import & Export**: In-memory indexing and Room batch transactions for fast data restores without UI lag.
            - **UI & Interaction Refinements**:
              - TimePickerDialog respects user 12H / 24H time format preference.
              - Disabled ripple shadows app-wide for clean visual feedback.
              - Double-click Complete / Uncomplete task toggling.
              - Clean single-color vector logo icon.
              - Date navigation indicators ("Viewing History", "Viewing Future").
              - Confirmation pop-ups for all deletion actions.

            #### Installation Instructions
            1. Download **`Daynexa-v${{ env.APP_VERSION }}-release.apk`** below.
            2. Open the APK on your Android device (Android 8.0+ / API 26+) and confirm installation.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
